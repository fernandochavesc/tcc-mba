<style>
  :root { --paper: #FAFAF7; --ink: #22303A; --muted: #4A5A66; --line: #DDE1D9; --accent: #0E6E5C; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #141B21; --ink: #E5E9EB; --muted: #9FAEB8; --line: #2C3842; --accent: #3FA88F; }
  }
  body {
    background: var(--paper); color: var(--ink);
    font-family: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
    line-height: 1.6; margin: 0; padding: 64px 24px;
  }
  .wrap { max-width: 60ch; margin: 0 auto; }

  h1 { font-size: 30px; line-height: 1.2; margin: 8px 0 8px; }
  p.sub { color: var(--muted); margin: 0 0 32px; }
  ul.pages { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  ul.pages li { border: 1px solid var(--line); border-radius: 8px; }
  ul.pages a { display: block; padding: 16px 20px; color: var(--ink); text-decoration: none; }
  ul.pages a:hover { border-color: var(--accent); }
  ul.pages b { color: var(--accent); }
  ul.pages span { display: block; color: var(--muted); font-size: 14.5px; margin-top: 2px; }
</style>
</head>

<div class="wrap">
